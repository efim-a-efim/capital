[versions]
agp = "9.4.1"
kotlin = "2.4.20"
compose = "2026.09.00"
activity = "1.13.0"
lifecycle = "2.11.0"
serialization = "1.11.0"
coroutines = "1.11.0"
okhttp = "5.5.0"
biometric = "1.1.0"
fragment = "1.9.1"
[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose" }
compose-material = { module = "androidx.compose.material3:material3" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-tooling = { module = "androidx.compose.ui:ui-tooling" }
activity = { module = "androidx.activity:activity-compose", version.ref = "activity" }
lifecycle = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
serialization = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
biometric = { module = "androidx.biometric:biometric", version.ref = "biometric" }
# biometric 1.1.0 pulls fragment 1.2, which breaks the Activity Result API used by every system picker
fragment = { module = "androidx.fragment:fragment", version.ref = "fragment" }
bc = { module = "org.bouncycastle:bcprov-jdk18on", version = "1.86" }
[plugins]
android = { id = "com.android.application", version.ref = "agp" }
compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
