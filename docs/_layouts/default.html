<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="icon" href="{{ '/assets/icon.svg' | relative_url }}" type="image/svg+xml">
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
<header class="top">
  <a class="brand" href="{{ '/' | relative_url }}"><img src="{{ '/assets/icon.svg' | relative_url }}" alt="" width="28" height="28">Capital</a>
  <nav>
    <a href="{{ '/manual' | relative_url }}">Manual</a>
    <a href="{{ '/privacy' | relative_url }}">Privacy</a>
    <a href="{{ '/#download' | relative_url }}">Download</a>
    <a href="{{ site.repo }}">Source</a>
  </nav>
</header>
<main class="{{ page.class }}">
{{ content }}
</main>
<footer>
  <p>© {{ site.developer }} · <a href="{{ '/privacy' | relative_url }}">Privacy Policy</a> · <a href="{{ '/data-safety' | relative_url }}">Data safety</a> · <a href="{{ '/financial-features' | relative_url }}">Financial features</a> · <a href="{{ site.repo }}">GitHub</a> · <a href="mailto:{{ site.contact }}">{{ site.contact }}</a></p>
</footer>
</body>
</html>
