name: Build APK

# Tags build, publish artifacts and create a GitHub release with a changelog.
# Manual runs build and publish artifacts; a manual run on a tag also creates the release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
      label: ${{ steps.version.outputs.label }}
      signed: ${{ steps.signing.outputs.signed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Read version
        id: version
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          test -n "$VERSION"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match versionName $VERSION in app/build.gradle.kts"
              exit 1
            fi
            LABEL="v$VERSION"
          else
            LABEL="v$VERSION-$(git rev-parse --short HEAD)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"

      - name: Unit tests and lint
        run: ./gradlew testDebugUnitTest lintDebug

      # Signed only when all four secrets are set and not empty. Then the signed APK is the only one published,
      # so updates install over each other. Otherwise the debug APK is published.
      - name: Check signing secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.CAPITAL_KEYSTORE_BASE64 }}
          CAPITAL_KEYSTORE_PASSWORD: ${{ secrets.CAPITAL_KEYSTORE_PASSWORD }}
          CAPITAL_KEY_ALIAS: ${{ secrets.CAPITAL_KEY_ALIAS }}
          CAPITAL_KEY_PASSWORD: ${{ secrets.CAPITAL_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$CAPITAL_KEYSTORE_PASSWORD" ] && [ -n "$CAPITAL_KEY_ALIAS" ] && [ -n "$CAPITAL_KEY_PASSWORD" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Signing secrets are missing or empty; the debug APK is published."
          fi

      - name: Build debug APK
        if: steps.signing.outputs.signed != 'true'
        run: ./gradlew assembleDebug

      - name: Build signed release APK
        if: steps.signing.outputs.signed == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.CAPITAL_KEYSTORE_BASE64 }}
          CAPITAL_KEYSTORE_PASSWORD: ${{ secrets.CAPITAL_KEYSTORE_PASSWORD }}
          CAPITAL_KEY_ALIAS: ${{ secrets.CAPITAL_KEY_ALIAS }}
          CAPITAL_KEY_PASSWORD: ${{ secrets.CAPITAL_KEY_PASSWORD }}
        run: |
          export CAPITAL_KEYSTORE="$RUNNER_TEMP/capital.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$CAPITAL_KEYSTORE"
          trap 'rm -f "$CAPITAL_KEYSTORE"' EXIT
          ./gradlew assembleRelease bundleRelease
          # A wrong key or password must fail the build, never publish an unsigned file.
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$APK" | grep "SHA-256"
          # The bundle is signed by Gradle with the same key; jarsigner confirms the signature is present.
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -f "$AAB"
          jarsigner -verify "$AAB" | grep -q "jar verified"

      - name: Collect APKs
        run: |
          mkdir -p dist
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/capital-${{ steps.version.outputs.label }}.apk"
            cp app/build/outputs/bundle/release/app-release.aab "dist/capital-${{ steps.version.outputs.label }}.aab"
          else
            cp app/build/outputs/apk/debug/app-debug.apk "dist/capital-${{ steps.version.outputs.label }}-debug.apk"
          fi
          (cd dist && sha256sum capital-* > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: capital-${{ steps.version.outputs.label }}
          path: dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: capital-${{ needs.build.outputs.label }}
          path: dist

      - name: Write changelog
        run: |
          TAG="$GITHUB_REF_NAME"
          PREVIOUS=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          {
            if [ -n "$PREVIOUS" ]; then
              echo "## Changes since $PREVIOUS"
              echo
              git log --no-merges --pretty='- %s' "$PREVIOUS..$TAG"
            else
              echo "## Changes"
              echo
              git log --no-merges --pretty='- %s' "$TAG"
            fi
            echo
            echo "## Files"
            echo
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
            echo
            if [ "${{ needs.build.outputs.signed }}" = "true" ]; then
              echo "The APK is signed with the permanent release key and installs over earlier signed versions. Coming from a debug build, uninstall first; your data folder is kept. The AAB is the same build for upload to Google Play."
            else
              echo "The debug APK is signed with a temporary key and cannot be installed over another build. Uninstall first; your data folder is kept."
            fi
          } > notes.md
          cat notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" dist/* --title "Capital $TAG" --notes-file notes.md --verify-tag
          fi
